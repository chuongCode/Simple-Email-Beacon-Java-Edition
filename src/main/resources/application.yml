spring:
  application:
    name: simple-email-beacon
  datasource:
    url: "jdbc:sqlite:${BEACON_DB_PATH:./email-beacon.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}

beacon:
  public-base-url: ${BEACON_PUBLIC_BASE_URL:http://localhost:8080}
  allowed-origins: ${BEACON_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  trust-forwarded-headers: ${BEACON_TRUST_FORWARDED_HEADERS:false}
